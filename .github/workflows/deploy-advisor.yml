name: Deploy Advisor (Windows)

# Deploys https://advise.smartplan.software — PRODUCTION.
#
# MANUAL TRIGGER ONLY. This used to run on every push to main; it no longer does.
# Production deploys happen when someone decides it is the right time, from the
# Actions tab ("Run workflow"), not as a side effect of merging. This mirrors the
# SmartPlan repo, where deploy-portal.yml (production) is likewise
# workflow_dispatch-only while deploy.yml (dev) auto-runs on main.
#
# Pushing to main deploys ADVISE-DEV (advisedev.smartplan.software) via
# deploy-advisor-dev.yml. Production is deliberately one deliberate click away.
#
# Flow (mirrors the SmartPlan deploy workflows, adapted for the pnpm monorepo):
#   1. Ubuntu runner: pnpm install + build the web PWA (Vite).
#   2. Tar the source + the built web bundle (no node_modules / .git / .env).
#   3. Phase 1 — DATABASE: ship migrations/runner, pg_dump, apply pending migrations.
#   4. Phase 2 — APP: SCP the tarball, extract, pnpm install, PM2 reload.
#
# ORDER MATTERS (zero-downtime on failure): the database is backed up and
# migrated FIRST, while the old app is still running and its old source is still
# on disk. Only after the DB succeeds do we extract the new bundle and reload
# PM2. If backup or migration fails, the deploy goes red and the site genuinely
# keeps serving the old version — the app files were never touched.
# (Phase 1 only overwrites db/migrations/*.sql, db/src/migrate.ts and
# deploy/db-deploy.ps1 — none of which the running API reads.)
#
# The Fastify API is NOT compiled here — it runs from TypeScript source via tsx
# (see ecosystem.config.cjs). Only the web bundle is built, because IIS serves it
# statically from C:\smartplan-advisor\apps\web\dist.
#
# Reuses the SAME repo secrets as the SmartPlan workflows:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT

on:
  # NO `push:` trigger — see the header. Adding one back would make every merge
  # to main deploy production.
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: "Allow migrations containing DROP/TRUNCATE to run (deliberate data loss)"
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # --prod=false so tsx (a devDependency) is installed — it is the production
      # interpreter for the API. See ecosystem.config.cjs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build web PWA
        run: pnpm --filter @smart-crm/web build

      # Bundle exactly what the box needs: all source + the freshly built
      # apps/web/dist, minus node_modules (recreated by pnpm on the box), .git,
      # .env, the API's stale compiled dist, and local dev storage.
      - name: Package deploy bundle
        run: |
          tar \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='apps/api/dist' \
            --exclude='*/storage-dev' \
            --exclude='*/storage-dev/*' \
            -czf deploy.tgz \
            apps packages db \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .npmrc \
            ecosystem.config.cjs

      # ---- Phase 1: database (old app keeps running throughout) ----

      # Wipe + recreate migrations/ so a file deleted from the repo can't linger on
      # the box and get re-applied. db/src and deploy/ are only ensured, never wiped
      # (db/src holds the live schema.ts the running API reads).
      - name: Prepare migration folders on the box
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor' | Out-Null; Remove-Item -Recurse -Force 'C:\smartplan-advisor\db\migrations' -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor\db\migrations' | Out-Null; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor\db\src' | Out-Null; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor\deploy' | Out-Null; Write-Host 'Migration folders ready'"

      - name: Upload db/migrations to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "db/migrations/*"
          target: "C:/smartplan-advisor/db/migrations"
          strip_components: 2

      # The runner + its env loader only. The API never imports either at runtime,
      # so dropping the new versions into the still-live tree is safe. The rest of
      # db/src (schema.ts and friends) is swapped in Phase 2 with everything else.
      - name: Upload migration runner to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "db/src/migrate.ts,db/src/loadenv.ts"
          target: "C:/smartplan-advisor/db/src"
          strip_components: 2

      - name: Upload deploy/ scripts to the box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Comma-separated, NOT a glob: every script this deploy runs has to be
          # named here or it silently will not exist on the box. pm2-roll.ps1 is
          # used by Phase 2 below but ships here in Phase 1, so deploy\ has one
          # upload step rather than two.
          source: "deploy/db-deploy.ps1,deploy/pm2-roll.ps1"
          target: "C:/smartplan-advisor/deploy"
          strip_components: 1

      # Back up (box's own pg_dump → C:\smartplan-backups\advisor-<stamp>.sql,
      # keeps last 10), then apply pending migrations. The old app is STILL
      # RUNNING and its source is untouched — any failure here (backup error,
      # un-baselined guard exit 3, destructive guard, SQL error) stops the deploy
      # with zero downtime.
      - name: Backup and migrate the DB (app still running)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -NoProfile -Command "Set-Location 'C:\smartplan-advisor'; $env:ALLOW_DESTRUCTIVE = '${{ inputs.allow_destructive }}'; powershell -NoProfile -File deploy\db-deploy.ps1 -Backup -Prefix advisor; if ($LASTEXITCODE -ne 0) { exit 1 }"

      # ---- Phase 2: swap the app (DB is ready; downtime = a PM2 reload) ----

      # We deliberately DO NOT delete the old bundle or stop the API here: the
      # tarball is extracted OVER the existing files, so the currently-live site
      # keeps serving until the new files land and PM2 reloads at the very end.
      # Rollback = re-run this workflow on the prior commit.
      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.tgz"
          target: "C:/smartplan-advisor"

      - name: Extract, install, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # FAIL-FAST: Windows PowerShell 5.1 does NOT turn a native command's
          # non-zero exit into a terminating error, and `;` does not short-circuit,
          # so we check $LASTEXITCODE after every native command and `exit 1` on
          # failure. Otherwise a failed `pnpm install` would be swallowed, PM2 would
          # reload against a half-installed tree, and the run would still go green.
          #   - tar.exe (bsdtar) ships with Windows 10 / Server 2019+.
          #   - Migrations already ran in Phase 1, deliberately BEFORE these files
          #     were swapped — there is no second db:migrate here.
          #   - deploy\pm2-roll.ps1 replaced `pm2 startOrReload`. Reload on Windows
          #     does NOT drain: PM2 renames the retiring worker's pm_id to a string,
          #     which makes it skip the graceful IPC path and fall back to
          #     process.kill() — an unconditional TerminateProcess there. The roll
          #     script restarts by numeric pm_id instead, which does drain via
          #     apps/api/src/lifecycle.ts, and health-gates the result. It still
          #     covers first-run (pm2 start) the way startOrReload did. This app is
          #     currently fork/1-instance, so the roll is a brief but GRACEFUL
          #     restart; it becomes zero-downtime the moment CLUSTERED flips in
          #     ecosystem.config.cjs, with no change needed here.
          script: |
            powershell -NoProfile -Command "$ErrorActionPreference='Stop'; Set-Location 'C:\smartplan-advisor'; $v=[version](node -p 'process.versions.node'); if ($v -lt [version]'20.6') { Write-Error ('Node >=20.6 required for --import tsx, found ' + $v); exit 1 }; tar -xzf deploy.tgz; if ($LASTEXITCODE -ne 0) { exit 1 }; Remove-Item deploy.tgz -Force; pnpm install --frozen-lockfile --prod=false; if ($LASTEXITCODE -ne 0) { exit 1 }; powershell -NoProfile -File deploy\pm2-roll.ps1 -AppName smartplan-advisor -Config ecosystem.config.cjs; if ($LASTEXITCODE -ne 0) { exit 1 }"
