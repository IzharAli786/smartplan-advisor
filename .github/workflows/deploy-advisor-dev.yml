name: Deploy Advisor DEV (Windows)

# Auto-deploys https://advisedev.smartplan.software on every push to `main` or
# `dev`.
#
# `main` is in that list on purpose: production (deploy-advisor.yml) is
# workflow_dispatch-only, so main is a DEV-deploying branch here, exactly as it
# is in the SmartPlan repo. Merging to main gets you a dev deploy and nothing
# else; production is a deliberate manual run. `dev` is kept so the existing
# branch workflow still works.
#
# Mirrors deploy-advisor.yml (prod), with three differences:
#   1. target folder is C:\smartplan-advisor-dev (not C:\smartplan-advisor)
#   2. the built web.config reverse-proxy port is patched 5052 -> 5053, because
#      the dev API runs on 5053 (prod is on 5052) on the same box.
#   3. PM2 uses ecosystem.dev.config.cjs (process "smartplan-advisor-dev").
#
# The dev box .env (C:\smartplan-advisor-dev\.env) is NOT shipped — it lives on the
# box and holds the dev DATABASE_URL (smartcrm_advisor_dev), API_PORT=5053,
# WEB_ORIGIN=https://advisedev..., and the dev SmartPlan pairing.
#
# Reuses the SAME repo secrets as the prod workflow:
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build web PWA
        run: pnpm --filter @smart-crm/web build

      # The dev API listens on 5053, so the reverse-proxy target in the built
      # web.config must point there instead of prod's 5052.
      - name: Point dev web.config at API port 5053
        run: |
          sed -i 's#localhost:5052#localhost:5053#g' apps/web/dist/web.config
          grep -q 'localhost:5053' apps/web/dist/web.config

      - name: Package deploy bundle
        run: |
          tar \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='apps/api/dist' \
            --exclude='*/storage-dev' \
            --exclude='*/storage-dev/*' \
            -czf deploy.tgz \
            apps packages db \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .npmrc \
            ecosystem.dev.config.cjs

      # ---- Phase 1: database (old app keeps running throughout) ----
      # Same shape as deploy-advisor.yml; see the ORDER MATTERS note there.
      # No -Backup here — dev is a testing instance. Add `-Backup -Prefix advisor-dev`
      # to the db-deploy.ps1 call below if that ever stops being true.

      - name: Prepare migration folders on the dev box
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor-dev' | Out-Null; Remove-Item -Recurse -Force 'C:\smartplan-advisor-dev\db\migrations' -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor-dev\db\migrations' | Out-Null; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor-dev\db\src' | Out-Null; New-Item -ItemType Directory -Force -Path 'C:\smartplan-advisor-dev\deploy' | Out-Null; Write-Host 'Migration folders ready'"

      - name: Upload db/migrations to the dev box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "db/migrations/*"
          target: "C:/smartplan-advisor-dev/db/migrations"
          strip_components: 2

      - name: Upload migration runner to the dev box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "db/src/migrate.ts,db/src/loadenv.ts"
          target: "C:/smartplan-advisor-dev/db/src"
          strip_components: 2

      - name: Upload deploy/ scripts to the dev box
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Comma-separated, NOT a glob: every script this deploy runs has to be
          # named here or it silently will not exist on the box. pm2-roll.ps1 is
          # used by Phase 2 below but ships here in Phase 1, so deploy\ has one
          # upload step rather than two.
          source: "deploy/db-deploy.ps1,deploy/pm2-roll.ps1"
          target: "C:/smartplan-advisor-dev/deploy"
          strip_components: 1

      - name: Migrate the dev DB (app still running)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -NoProfile -Command "Set-Location 'C:\smartplan-advisor-dev'; powershell -NoProfile -File deploy\db-deploy.ps1; if ($LASTEXITCODE -ne 0) { exit 1 }"

      # ---- Phase 2: swap the app ----

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy.tgz"
          target: "C:/smartplan-advisor-dev"

      # Migrations already ran in Phase 1, before these files were swapped —
      # there is no second db:migrate here.
      - name: Extract, install, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # `pm2 startOrReload` was replaced by deploy\pm2-roll.ps1. Reload on
          # Windows does NOT drain: PM2 renames the retiring worker's pm_id to a
          # string, which makes it skip the graceful IPC path and fall back to
          # process.kill() — an unconditional TerminateProcess there. The roll
          # script restarts workers one at a time by numeric pm_id instead, which
          # does drain via apps/api/src/lifecycle.ts, and health-gates each one.
          # It also covers the first-run case startOrReload used to handle.
          script: |
            powershell -NoProfile -Command "$ErrorActionPreference='Stop'; Set-Location 'C:\smartplan-advisor-dev'; $v=[version](node -p 'process.versions.node'); if ($v -lt [version]'20.6') { Write-Error ('Node >=20.6 required for --import tsx, found ' + $v); exit 1 }; tar -xzf deploy.tgz; if ($LASTEXITCODE -ne 0) { exit 1 }; Remove-Item deploy.tgz -Force; pnpm install --frozen-lockfile --prod=false; if ($LASTEXITCODE -ne 0) { exit 1 }; powershell -NoProfile -File deploy\pm2-roll.ps1 -AppName smartplan-advisor-dev -Config ecosystem.dev.config.cjs; if ($LASTEXITCODE -ne 0) { exit 1 }"
